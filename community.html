   <script>alert(`Please read the rules below carefully and follow them

const DB_INFO = {
  api: "https://tinywebdb.appinventor.space/api",
  user: "zreamer",
  secret: "786a98bf"
}
let isWriting = false;

async function writeDB(tag, content) {
  const form = new FormData();
  form.append("user", DB_INFO.user);
  form.append("secret", DB_INFO.secret);
  form.append("action", "update");
  form.append("tag", tag);
  form.append("value", content);
  try {
    const res = await fetch(DB_INFO.api, {
      method: "POST",
      body: form
    })
    return await res.text();
  } catch (err) {
    alert("Load failed: " + err.message);
    return "";
  }
}

async function readDB(tag) {
  const form = new FormData();
  form.append("user", DB_INFO.user);
  form.append("secret", DB_INFO.secret);
  form.append("action", "get");
  form.append("tag", tag);
  try {
    const res = await fetch(DB_INFO.api, {
      method: "POST",
      body: form
    })
    return await res.text();
  } catch (err) {
    alert("send failed: " + err.message);
    return "";
  }
}

const ts = Date.now();
const todayDay = Math.floor(ts / 86400000);
let currentDay = todayDay;

// 读取直接输出HTML，不解析MD
async function renderDay(dayNum) {
  const rawHtml = await readDB('zwcommunity'+dayNum);
  document.getElementById('output').innerHTML = rawHtml;
}

(async function init() {
  await renderDay(currentDay);
})();

async function send() {
  if(isWriting) return alert("Message submitting, please wait!");
  const nameInput = document.getElementById('name');
  const msgInput = document.getElementById('message');
  const userName = nameInput.value.trim();
  const userMsg = msgInput.value.trim();

  if (!userName || !userMsg) {
    alert('昵称或留言内容不能为空！');
    return;
  }
  isWriting = true;
  try{
    const sendTime = new Date().toLocaleString();
    // 仅发送时把MD转HTML
    const newMsgMd = `# ${userName}\n${sendTime}\n${userMsg}\n\n---\n`;
    const newHtml = marked.parse(newMsgMd);

    // 固定读取今日数据，所有发送全部写入今日tag
    const oldContent = await readDB('zwcommunity'+todayDay);
    // 新消息拼在最前面，追加不覆盖
    const allContent = newHtml + oldContent;

    // 强制写入今日，固定 todayDay
    await writeDB('zwcommunity'+todayDay, allContent);
    // 发送完成刷新当前浏览页面
    await renderDay(currentDay);
    nameInput.value = "";
    msgInput.value = "";
    alert('Send successfully 🎊');
  }catch(e){
    alert("Send failed: " + e.message);
  }finally{
    isWriting = false;
  }
}

async function today() {
  currentDay = todayDay;
  await renderDay(currentDay);
}
async function yesterday() {
  if (currentDay > 0) {
    currentDay--;
    await renderDay(currentDay);
  } else {
    alert('No more contents! ');
  }
}
async function tomorrow() {
  if (currentDay < todayDay) {
    currentDay++;
    await renderDay(currentDay);
  } else {
    alert('No more contents! ');
  }
}

</script>
