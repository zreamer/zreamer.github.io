<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zreamer Community</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* 顶部导航 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top);
    }

    .nav-inner {
      max-width: 680px;
      margin: 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #1d1d1f;
      min-width: 0;
    }

    .nav-brand .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav-brand .brand-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-count {
      font-size: 11px;
      color: #86868b;
      font-weight: 400;
      white-space: nowrap;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .date-bar {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .date-btn {
      padding: 5px 10px;
      border: none;
      background: transparent;
      color: #86868b;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      white-space: nowrap;
    }

    .date-btn:hover {
      background: rgba(0,0,0,0.04);
      color: #1d1d1f;
    }

    .date-btn.active {
      background: rgba(0,122,255,0.1);
      color: #007aff;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #86868b;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(0,0,0,0.04);
      color: #1d1d1f;
    }

    .icon-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .lang-switch {
      font-size: 12px;
      color: #007aff;
      background: rgba(0,122,255,0.08);
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .lang-switch:hover {
      background: rgba(0,122,255,0.15);
    }

    /* 聊天区域 */
    .chat-area {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px 200px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    /* 日期分割线 */
    .date-divider {
      text-align: center;
      margin: 16px 0;
      position: relative;
    }

    .date-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e5e5ea;
    }

    .date-divider span {
      position: relative;
      background: #f5f5f7;
      padding: 0 12px;
      font-size: 11px;
      color: #86868b;
    }

    /* 微信气泡消息 */
    .msg-bubble {
      display: flex;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-bubble .avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
      margin-right: 10px;
      user-select: none;
    }

    .msg-bubble .bubble-wrap {
      max-width: 75%;
      min-width: 0;
    }

    .msg-bubble .bubble-name {
      font-size: 11px;
      color: #86868b;
      margin-bottom: 3px;
      padding-left: 2px;
    }

    .msg-bubble .bubble-content {
      background: #fff;
      padding: 10px 14px;
      border-radius: 4px 16px 16px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      font-size: 14px;
      line-height: 1.55;
      color: #1d1d1f;
      word-break: break-word;
    }

    .msg-bubble .bubble-time {
      font-size: 10px;
      color: #c7c7cc;
      margin-top: 3px;
      padding-left: 2px;
    }

    /* 自己的消息（右侧） */
    .msg-bubble.self {
      flex-direction: row-reverse;
    }

    .msg-bubble.self .avatar {
      margin-right: 0;
      margin-left: 10px;
      background: linear-gradient(135deg, #34c759, #30d158) !important;
    }

    .msg-bubble.self .bubble-wrap {
      text-align: right;
    }

    .msg-bubble.self .bubble-name {
      padding-left: 0;
      padding-right: 2px;
    }

    .msg-bubble.self .bubble-content {
      background: #007aff;
      color: #fff;
      border-radius: 16px 4px 16px 16px;
      text-align: left;
    }

    .msg-bubble.self .bubble-time {
      padding-left: 0;
      padding-right: 2px;
    }

    /* 气泡内样式 */
    .bubble-content h1, .bubble-content h2, .bubble-content h3 {
      font-size: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .bubble-content p {
      margin-bottom: 6px;
    }

    .bubble-content p:last-child {
      margin-bottom: 0;
    }

    .bubble-content code {
      background: rgba(0,0,0,0.08);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: Consolas, 'SF Mono', Monaco, monospace;
      font-size: 12px;
    }

    .msg-bubble.self .bubble-content code {
      background: rgba(255,255,255,0.2);
    }

    .bubble-content pre {
      background: #1c1c1e;
      color: #f5f5f7;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 12px;
    }

    .bubble-content pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    .bubble-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 4px 0;
    }

    .bubble-content a {
      color: #007aff;
      text-decoration: underline;
    }

    .msg-bubble.self .bubble-content a {
      color: #fff;
      text-decoration: underline;
    }

    .bubble-content blockquote {
      border-left: 2px solid #e5e5ea;
      padding-left: 10px;
      margin: 6px 0;
      color: #666;
    }

    .bubble-content ul, .bubble-content ol {
      padding-left: 18px;
      margin: 6px 0;
    }

    .bubble-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 12px;
    }

    .bubble-content th, .bubble-content td {
      border: 1px solid #e5e5ea;
      padding: 5px 8px;
    }

    .bubble-content th {
      background: #f2f2f7;
    }

    .bubble-content hr {
      border: none;
      border-top: 1px solid #e5e5ea;
      margin: 8px 0;
    }

    /* 骨架屏 */
    .skeleton-bubble {
      display: flex;
      margin-bottom: 16px;
    }

    .skeleton-bubble .sk-avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #e8e8ed;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .skeleton-bubble .sk-body {
      flex: 1;
      max-width: 60%;
    }

    .skeleton-bubble .sk-line {
      height: 12px;
      border-radius: 6px;
      background: #e8e8ed;
      margin-bottom: 8px;
    }

    .skeleton-bubble .sk-line.short { width: 45%; }
    .skeleton-bubble .sk-line.long { width: 90%; }

    .skeleton-bubble .sk-avatar,
    .skeleton-bubble .sk-line {
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* 年份列表 */
    .year-list {
      padding: 8px 0;
    }

    .year-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 15px 18px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: all 0.2s;
      animation: fadeIn 0.3s ease;
    }

    .year-item:hover {
      background: #f9f9fb;
      transform: translateX(2px);
    }

    .year-item .chev {
      color: #c7c7cc;
      font-size: 18px;
    }

    /* 空状态 / 错误状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #86868b;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-retry {
      margin-top: 14px;
      padding: 8px 22px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-retry:hover {
      background: #0056b3;
    }

    /* 回到底部按钮 */
    .scroll-bottom-btn {
      position: fixed;
      right: 20px;
      bottom: 120px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      color: #007aff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.25s;
    }

    .scroll-bottom-btn.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .scroll-bottom-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    /* 输入区 */
    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.06);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      z-index: 99;
    }

    .input-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-name {
      flex: 0 0 65px;
      padding: 12px 14px;
      border: 1px solid #e5e5ea;
      border-radius: 18px;
      font-size: 15px;
      background: #f9f9fb;
      outline: none;
      transition: all 0.2s;
      height: 44px;
    }

    .input-name:focus {
      border-color: #007aff;
      background: #fff;
    }

    .input-msg {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e5ea;
      border-radius: 18px;
      font-size: 15px;
      background: #f9f9fb;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      transition: all 0.2s;
      font-family: inherit;
      line-height: 1.5;
    }

    .input-msg:focus {
      border-color: #007aff;
      background: #fff;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-send:hover:not(:disabled) {
      background: #0056b3;
      transform: scale(1.05);
    }

    .btn-send:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .input-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
      gap: 8px;
    }

    .input-hint .hint-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .input-hint span {
      font-size: 11px;
      color: #c7c7cc;
      white-space: nowrap;
    }

    .char-count {
      font-size: 11px;
      color: #c7c7cc;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .char-count.warn {
      color: #ff9500;
    }

    .input-hint a {
      font-size: 11px;
      color: #c7c7cc;
      text-decoration: none;
      white-space: nowrap;
    }

    .input-hint a:hover {
      color: #007aff;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1c1c1e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
      pointer-events: none;
      max-width: 85vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 规则弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 20px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: #f2f2f7;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #666;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #e5e5ea;
    }

    .modal-body {
      padding: 16px 24px 24px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
    }

    .modal-body h3 {
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 8px;
      color: #1d1d1f;
    }

    .modal-body h3:first-child {
      margin-top: 0;
    }

    .modal-body ul {
      padding-left: 18px;
      margin: 6px 0;
    }

    .modal-body li {
      margin: 4px 0;
    }

    .modal-footer {
      padding: 0 24px 20px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .input-name {
        flex: 0 0 52px;
        padding: 12px 10px;
        font-size: 14px;
      }
      .input-msg {
        font-size: 14px;
      }
      .msg-bubble .bubble-wrap {
        max-width: 80%;
      }
      .msg-count {
        display: none;
      }
      .date-btn {
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-brand">
        <span class="brand-text" data-i18n="brand">Community</span>
        <span class="msg-count" id="msgCount"></span>
      </div>
      <div class="nav-right">
        <div class="date-bar">
          <button class="date-btn" onclick="yesterday()" data-i18n="yesterday">Yesterday</button>
          <button class="date-btn active" onclick="today()" data-i18n="today">Today</button>
          <button class="date-btn" onclick="recent15()" data-i18n="recent15">Recent 15</button>
          <button class="date-btn" onclick="renderHistory()" data-i18n="history">History</button>
        </div>
        <button class="icon-btn" onclick="refresh()" id="refreshBtn" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button class="icon-btn" onclick="showRules()" id="rulesBtn" title="Rules">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        </button>
        <button class="lang-switch" onclick="toggleLang()" id="langBtn">中文</button>
      </div>
    </div>
  </nav>

  <!-- 聊天区域 -->
  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
      <div id="output"></div>
    </div>
  </div>

  <!-- 回到底部 -->
  <button class="scroll-bottom-btn" id="scrollBottomBtn" onclick="scrollToBottom(true)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>

  <!-- 输入区 -->
  <div class="input-area">
    <div class="input-inner">
      <div class="input-row">
        <input type="text" id="name" class="input-name" placeholder="Nickname..." data-i18n-placeholder="namePlaceholder" maxlength="20">
        <textarea id="message" class="input-msg" placeholder="Share your tech thoughts..." data-i18n-placeholder="msgPlaceholder" rows="1" maxlength="2000"></textarea>
        <button class="btn-send" onclick="send()" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22,2 15,22 11,13 2,9 22,2"></polygon></svg>
        </button>
      </div>
      <div class="input-hint">
        <div class="hint-left">
          <span data-i18n="supports">Markdown &amp; HTML supported</span>
          <span class="char-count" id="charCount"></span>
        </div>
        <a href="index.html" data-i18n="backIndex">&larr; Index</a>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 规则弹窗 -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 data-i18n="rulesTitle">Community Rules</h2>
        <button class="modal-close" onclick="hideRules()">&times;</button>
      </div>
      <div class="modal-body" id="rulesContent"></div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="hideRules()" data-i18n="gotIt">Got it</button>
      </div>
    </div>
  </div>

<script>
// ========== 多语言 ==========

const avatarColors = [
  '#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF',
  '#5856D6', '#AF52DE', '#FF2D55', '#5AC8FA', '#FF6B6B'
];

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return avatarColors[Math.abs(hash) % avatarColors.length];
}

function getInitials(name) {
  return name.charAt(0).toUpperCase();
}

// 基础 XSS 过滤：剔除危险标签与事件属性，与社区守则一致
function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const banned = ['script', 'iframe', 'style', 'embed', 'frame', 'object', 'form', 'input', 'button', 'link', 'meta'];
  banned.forEach(tag => doc.querySelectorAll(tag).forEach(el => el.remove()));
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      const n = attr.name.toLowerCase();
      const v = String(attr.value).replace(/\s/g, '').toLowerCase();
      if (n.startsWith('on') || v.startsWith('javascript:')) el.removeAttribute(attr.name);
    });
  });
  return doc.body.innerHTML;
}

// 解析消息为气泡数组
function parseMessages(htmlContent, dayNum) {
  const msgs = [];
  const parts = htmlContent.split(/<hr\s*\/?>/i);

  for (let part of parts) {
    part = part.trim();
    if (!part) continue;

    const h1Match = part.match(/<h1[^>]*>(.*?)<\/h1>/i);
    const h2Match = part.match(/<h2[^>]*>(.*?)<\/h2>/i);
    const h3Match = part.match(/<h3[^>]*>(.*?)<\/h3>/i);
    const name = h1Match ? h1Match[1] : (h2Match ? h2Match[1] : (h3Match ? h3Match[1] : 'Anonymous'));

    const timeMatch = part.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}[\s,]+\d{1,2}:\d{2}(?::\d{2})?)/);
    const timeStr = timeMatch ? timeMatch[1] : '';

    let content = part
      .replace(/<h[123][^>]*>.*?<\/h[123]>/gi, '')
      .replace(/\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}[\s,]+\d{1,2}:\d{2}(?::\d{2})?/g, '')
      .trim();

    // 跳过只含标点残渣的无效片段（如旧版本遗留的 JSON 括号）
    const textOnly = content.replace(/<[^>]*>/g, '').trim();
    if (!textOnly || /^[>"'}\]\[\s,;.!?:;_-]*$/.test(textOnly)) continue;

    if (content) {
      msgs.push({ name, time: timeStr, content: sanitizeHtml(content), day: dayNum });
    }
  }

  return msgs.reverse();
}

// 友好的相对时间
function formatTime(timeStr) {
  if (!timeStr) return '';
  const d = new Date(timeStr.replace(/\//g, '-').replace(',', ''));
  if (isNaN(d.getTime())) return timeStr;

  const diff = Date.now() - d.getTime();
  const t = i18n[currentLang];
  if (diff < 60000 && diff >= 0) return t.justNow;
  if (diff < 3600000 && diff >= 0) return Math.floor(diff / 60000) + t.minutesAgo;
  if (diff < 86400000 && diff >= 0 && d.getDate() === new Date().getDate()) {
    return Math.floor(diff / 3600000) + t.hoursAgo;
  }
  return timeStr;
}

function renderBubble(msg, isSelf) {
  const color = getAvatarColor(msg.name);
  const initials = getInitials(msg.name);
  const selfClass = isSelf ? 'self' : '';

  return `
    <div class="msg-bubble ${selfClass}">
      <div class="avatar" style="background:${color}">${initials}</div>
      <div class="bubble-wrap">
        <div class="bubble-name">${escapeHtml(msg.name)}</div>
        <div class="bubble-content">${msg.content}</div>
        <div class="bubble-time">${escapeHtml(formatTime(msg.time))}</div>
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 从 API 响应中提取实际内容（接口返回 JSON：{"tag": "内容"}）
// 注意：接口返回的 JSON 字符串内含未转义的换行符，属于非法 JSON，需先清洗
function extractValue(raw, tag) {
  if (!raw) return '';
  const trimmed = raw.trim();
  if (trimmed.startsWith('{')) {
    // 先把字符串值中的裸控制字符转义，再解析
    const cleaned = trimmed
      .replace(/\r/g, '\\r')
      .replace(/\n/g, '\\n')
      .replace(/\t/g, '\\t');
    try {
      const obj = JSON.parse(cleaned);
      const val = obj[tag];
      return (val && val !== 'null') ? String(val) : '';
    } catch (e) {
      // 兜底：正则提取 "tag": "..." 的值
      const m = trimmed.match(new RegExp('"' + tag + '"\\s*:\\s*"([\\s\\S]*)\"\\s*}\\s*$'));
      if (m) {
        return m[1].replace(/\\r/g, '\r').replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
      }
      return '';
    }
  }
  if (trimmed === '' || trimmed.includes('Not Found') || trimmed === 'null' || trimmed.includes('"null"')) {
    return '';
  }
  return trimmed;
}

// 加载某天的消息
async function loadDay(dayNum) {
  if (loadedDays.has(dayNum)) return [];
  loadedDays.add(dayNum);

  const tag = 'zwcommunity' + dayNum;
  let content = extractValue(await readDB(tag), tag);

  // 防御性清洗：去掉旧版本误写入的 JSON 外壳残渣
  content = content
    .replace(/\{"zwcommunity\d*"\s*:\s*"/g, '')
    .replace(/"\s*}\s*$/g, '')
    .trim();

  if (!content) return [];
  return parseMessages(content, dayNum);
}

// 渲染所有消息
function renderAll() {
  const output = document.getElementById('output');
  const myName = document.getElementById('name').value.trim();

  if (loadError) {
    output.innerHTML = `
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
        <p>${i18n[currentLang].loadFail}</p>
        <button class="btn-retry" onclick="refresh()">${i18n[currentLang].retry}</button>
      </div>
    `;
    updateMsgCount();
    return;
  }

  if (allMessages.length === 0) {
    output.innerHTML = `
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <p>${i18n[currentLang].emptyMsg}</p>
      </div>
    `;
    updateMsgCount();
    return;
  }

  let html = '';

  // 近期视图顶部：加载更早的消息
  if (currentDay === -1 && earliestDay !== null && earliestDay > 0) {
    html += `<div style="text-align:center;margin:4px 0 16px"><button class="btn-retry" style="margin-top:0" onclick="loadEarlier()">${i18n[currentLang].loadEarlier}</button></div>`;
  }

  let lastDay = null;

  for (const msg of allMessages) {
    if (msg.day !== lastDay) {
      const dateStr = new Date(msg.day * 86400000).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US');
      html += `<div class="date-divider"><span>${escapeHtml(dateStr)}</span></div>`;
      lastDay = msg.day;
    }

    const isSelf = myName && msg.name === myName;
    html += renderBubble(msg, isSelf);
  }

  output.innerHTML = html;
  updateMsgCount();
}

// 更新日期按钮状态
function updateDateBtns() {
  const btns = document.querySelectorAll('.date-btn');
  btns.forEach(btn => btn.classList.remove('active'));
  if (currentDay === todayDay - 1) btns[0].classList.add('active');
  else if (currentDay === todayDay) btns[1].classList.add('active');
  else if (currentDay === -1) btns[2].classList.add('active');
  else if (currentDay === -2 || currentDay === -3) btns[3].classList.add('active');
}

// 渲染指定日期
async function renderDay(dayNum) {
  currentDay = dayNum;
  allMessages = [];
  loadedDays.clear();
  loadError = false;
  showSkeleton();
  updateDateBtns();

  try {
    if (dayNum === -1) {
      // 并行加载最近15天
      const days = [];
      for (let d = todayDay; d >= Math.max(0, todayDay - 14); d--) days.push(d);
      const results = await Promise.all(days.map(d => loadDay(d)));
      allMessages = results.flat();
      earliestDay = Math.max(0, todayDay - 14);
    } else {
      allMessages = await loadDay(dayNum);
      earliestDay = null;
    }
  } catch (e) {
    loadError = true;
  }

  renderAll();
  updateDateBtns();

  setTimeout(() => scrollToBottom(false), 100);
}

  currentDay = -3;
  viewYear = null;
  earliestDay = null;
  allMessages = [];
  loadError = false;
  updateDateBtns();

  const thisYear = new Date().getFullYear();
  let html = '<div class="year-list">';
  for (let y = thisYear; y >= 2020; y--) {
    html += `<div class="year-item" onclick="renderYear(${y})"><span>${y}${i18n[currentLang].yearUnit}</span><span class="chev">›</span></div>`;
  }
  html += '</div>';
  document.getElementById('output').innerHTML = html;
  document.getElementById('msgCount').textContent = '';
  document.getElementById('chatArea').scrollTop = 0;
}

// 加载某一年的全部消息（分块并行，带进度）
async function renderYear(year) {
  currentDay = -2;
  viewYear = year;
  earliestDay = null;
  allMessages = [];
  loadError = false;
  loadedDays.clear();
  updateDateBtns();

  const startDay = Math.floor(new Date(year, 0, 1).getTime() / 86400000);
  const endDay = Math.min(Math.floor(new Date(year, 11, 31).getTime() / 86400000), todayDay);
  const days = [];
  for (let d = startDay; d <= endDay; d++) days.push(d);

  const total = days.length;
  const t = i18n[currentLang];
  const progressText = done => t.loadingYear.replace('{y}', year).replace('{done}', done).replace('{total}', total);
  document.getElementById('output').innerHTML = `<div class="empty-state"><p id="loadProgress">${progressText(0)}</p></div>`;

  try {
    const CHUNK = 40;
    for (let i = 0; i < days.length; i += CHUNK) {
      const results = await Promise.all(days.slice(i, i + CHUNK).map(d => loadDay(d)));
      allMessages = allMessages.concat(results.flat());
      const p = document.getElementById('loadProgress');
      if (p) p.textContent = progressText(Math.min(i + CHUNK, total));
    }
  } catch (e) {
    loadError = true;
  }

  renderAll();
  updateDateBtns();
  document.getElementById('chatArea').scrollTop = 0;
}

// 加载更早的15天（在近期视图顶部追加）
async function loadEarlier() {
  if (currentDay !== -1 || earliestDay === null || earliestDay <= 0) return;

  const chatArea = document.getElementById('chatArea');
  const prevHeight = chatArea.scrollHeight;

  const from = earliestDay - 1;
  const to = Math.max(0, earliestDay - 15);
  const days = [];
  for (let d = from; d >= to; d--) days.push(d);

  let older = [];
  try {
    const results = await Promise.all(days.map(d => loadDay(d)));
    older = results.flat();
  } catch (e) {
    showToast(i18n[currentLang].loadFail, true);
    return;
  }

  earliestDay = to;
  if (older.length === 0) {
    earliestDay = 0; // 整段为空，视为没有更早的消息
    showToast(i18n[currentLang].noEarlier, false);
  }

  allMessages = older.concat(allMessages);
  renderAll();

  // 保持滚动位置，不让页面跳到底部
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight - prevHeight;
  });
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  if (currentDay === -2 && viewYear) {
    await renderYear(viewYear);
  } else if (currentDay === -3) {
    renderHistory();
  } else {
    await renderDay(currentDay);
  }
  btn.classList.remove('spinning');
}

// ========== 发送消息 ==========
async function send() {
  if (isWriting) {
    showToast(i18n[currentLang].submitting, true);
    return;
  }

  const nameInput = document.getElementById('name');
  const msgInput = document.getElementById('message');
  const userName = nameInput.value.trim();
  const userMsg = msgInput.value.trim();

  if (!userName || !userMsg) {
    showToast(i18n[currentLang].nameEmpty, true);
    return;
  }

  isWriting = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    // 固定时间格式，保证任何浏览器语言下都能被解析
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const sendTime = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const newMsgMd = `# ${userName}\n${sendTime}\n${userMsg}\n\n---\n`;
    const newHtml = marked.parse(newMsgMd);

    const tag = 'zwcommunity' + todayDay;
    const oldContent = extractValue(await readDB(tag), tag);
    const allContent = newHtml + oldContent;

    await writeDB(tag, allContent);

    // 刷新当前视图
    if (currentDay === -2 && viewYear) {
      await renderYear(viewYear);
    } else if (currentDay === -3) {
      await renderDay(todayDay);
    } else {
      await renderDay(currentDay);
    }

    msgInput.value = "";
    msgInput.style.height = '44px';
    updateCharCount();
    showToast(i18n[currentLang].sendSuccess, false);
    msgInput.focus();

    setTimeout(() => scrollToBottom(true), 100);
  } catch(e) {
    showToast(i18n[currentLang].sendFail + e.message, true);
  } finally {
    isWriting = false;
    updateSendBtn();
  }
}

// ========== Toast ==========
let toastTimer = null;
function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? '#ff3b30' : '#1c1c1e';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== 滚动 ==========
function scrollToBottom(smooth) {
  const chatArea = document.getElementById('chatArea');
  chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

document.getElementById('chatArea').addEventListener('scroll', function() {
  const btn = document.getElementById('scrollBottomBtn');
  const dist = this.scrollHeight - this.scrollTop - this.clientHeight;
  btn.classList.toggle('show', dist > 300);
});

// ========== 输入辅助 ==========
function updateCharCount() {
  const len = document.getElementById('message').value.length;
  const el = document.getElementById('charCount');
  el.textContent = len > 0 ? len + ' / 2000' : '';
  el.classList.toggle('warn', len > 1800);
}

function updateSendBtn() {
  const hasMsg = document.getElementById('message').value.trim().length > 0;
  document.getElementById('sendBtn').disabled = !hasMsg || isWriting;
}

// ========== 初始化 ==========
(async function init() {
  // 恢复昵称
  const savedName = PREFS.name;
  if (savedName) document.getElementById('name').value = savedName;

  // 语言：本地偏好 > 浏览器语言
  const browserLang = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  setLang(PREFS.lang || browserLang);

  // 首次访问自动展示守则
  if (!PREFS.rulesRead) showRules();

  await renderDay(todayDay);

  // 桌面端自动聚焦输入框
  if (window.innerWidth > 768) document.getElementById('message').focus();
})();

// 输入框自动增高 + 字数统计 + 发送按钮状态
document.getElementById('message').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  updateCharCount();
  updateSendBtn();
});

// Enter 发送，Shift+Enter 换行
document.getElementById('message').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// 昵称：记住 + 重新渲染高亮自己
document.getElementById('name').addEventListener('input', function() {
  PREFS.name = this.value.trim();
  renderAll();
});
</script>
