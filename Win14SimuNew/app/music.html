<!DOCTYPE html>
<html>
<head>
  <title>Hello World</title>
</head>
<body style="background:#caf1ff;margin:0">
<div style="width:38vw;height:calc( 100vh - 16px );background-color:#dddddd;padding:10px;">

  <button type="button" style="width:100%;height:auto;border-radius:5px;border:none;background:none;" onclick="play('tdiber')" id="tdiber"><h3>These Days in Beijing East Road</h3></button><button type="button" style="width:100%;height:auto;border-radius:5px;border:none;background:none;" onclick="play('wpdphw')" id="wpdphw"><h3>外婆的澎湖湾</h3></button><button type="button" style="width:100%;height:auto;border-radius:5px;border:none;background:none;" onclick="play('aboh')" id="aboh"><h3>A Bit of Happiness</h3></button><button type="button" style="width:100%;height:auto;border-radius:5px;border:none;background:none;" onclick="play('sya')" id="sya"><h3>Near The Butterfly Spring</h3></button></div>
  <audio id="au">
  <source src="" type="audio/mpeg">
  </audio>
  <div style="width:50vw;height:calc( 100vh - 16px );background-color:#bae1ff;padding:10px;position:absolute;top:0;right:0;margin:8px;text-align:center">
  <img src="https://ts4.tc.mm.bing.net/th/id/OIP-C.-aYp8cYvHs1xtnMt9Jk1IwHaHa?r=0&dpr=3.8&pid=ImgDetMain&o=7&rm=3" alt="图片描述" id="i" style="border-radius: 5px;position:absolute;top:30%;left:30%;width: 30vw;height: 30vw;"/>
  <iframe style="position:absolute;top:50vh;left:20%;background-color:none;border-radius:5px;border:none;width: 60%;height: 25%;overflow: auto;color: black;text-align:center;border: none" id="lrc"></iframe>
<button type="button" style="position:absolute;top:75vh;left:20%;background-color:#9ac1ee;border-radius:5px;border:none;width: 60%" onclick="sas()">播放/暂停</button></div>
  <div style="position:fixed;top:0;right:0;width:22vw;height:4vh;border-radius:0 0 0 2.5vh;background-color:#cbf2ff;z-index:1000"></div>
  
  <script>
  let i = 1;
  function play(s) {
 	 document.getElementById('tdiber').style.background='none';
	  document.getElementById('wpdphw').style.background='none';
	  document.getElementById('aboh').style.background='none';
	  document.getElementById('sya').style.background='none';
	  document.getElementById('tdiber').style.border='none';
	  document.getElementById('wpdphw').style.border='none';
	  document.getElementById('aboh').style.border='none';
	  document.getElementById('sya').style.border='none';
	  document.getElementById('au').src='msc/'+s+'.mp3';
	  document.getElementById('au').play();
	  document.getElementById(s).style.backgroundColor='#eeeefa';
	  document.getElementById(s).style.borderLeft='solid 3px #6666bb';
	  document.getElementById('i').src='msc/'+s+'.jpg';document.getElementById('lrc').src='msc/'+s+'lrc.html';
  }
  function sas() {
 	 if (i==1) {
 		 document.getElementById('au').pause();
		  i=2;
 	 }else {
 		 document.getElementById('au').play();
		  i=1;
 	 }
  }</script>
</body>
</html>
