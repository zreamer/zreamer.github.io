<h1>英语笔记</h1>
<h2>过去进行时中when和while的区别</h2>
<ol>
<li>While:during a longer ongoing action (+ Past Continuous tense)</li>
<li>When:At that moment (often a shorter action)(+Simple past tense)</li>
</ol>
<h2>过去进行时语法</h2>
<p>What was ... doing at the time of ...<br>What was/were ... doing when/while ...<br>Somebody was doing sth</p>
